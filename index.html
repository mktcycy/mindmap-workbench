<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心智圖工具</title>
<meta name="description" content="建立多張心智圖、自由增刪節點，按儲存就寫回雲端。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EDF0F2; --ground-2:#E4E9EC; --surface:#FFFFFF; --surface-2:#F6F8F9;
  --ink:#141D23; --ink-2:#4C5C66; --muted:#7A8B95;
  --line:#D2DADF; --line-2:#BBC6CD;
  --accent:#14607F; --accent-ink:#FFFFFF; --accent-soft:#DCEAF1;
  --danger:#A6412F; --ok:#2C6E54;
  --d0:#14607F; --d1:#1E7F74; --d2:#50783C; --d3:#8A6A24; --d4:#8A4A52;
  --hit:#B5762A; --hit-soft:#F6E3BE;
  --c-sky:#1E6F96; --c-teal:#15806F; --c-green:#4F7D33; --c-amber:#977216;
  --c-orange:#A85A28; --c-rose:#A63F52; --c-violet:#6B4E9E; --c-slate:#5C6B75;
  --dot:rgba(20,29,35,.11);
  --shadow:0 1px 2px rgba(20,29,35,.06), 0 6px 18px rgba(20,29,35,.07);
  --font-ui:"Archivo","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1317; --ground-2:#121A1F; --surface:#17222A; --surface-2:#1C2831;
    --ink:#E4EDF2; --ink-2:#A8BAC4; --muted:#7D909C;
    --line:#27353E; --line-2:#36474F;
    --accent:#4FA6C9; --accent-ink:#06171F; --accent-soft:#17323F;
    --danger:#E08874; --ok:#6FC39C;
    --d0:#4FA6C9; --d1:#4FBCAE; --d2:#8FBE6B; --d3:#D6B163; --d4:#D98B93;
    --hit:#E0B45F; --hit-soft:#4A3A1C;
    --c-sky:#5BB2D4; --c-teal:#4FC2B0; --c-green:#93C169; --c-amber:#D9B45E;
    --c-orange:#E0945F; --c-rose:#E07F96; --c-violet:#A98FDD; --c-slate:#93A4AF;
    --dot:rgba(228,237,242,.10);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.34);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1317; --ground-2:#121A1F; --surface:#17222A; --surface-2:#1C2831;
  --ink:#E4EDF2; --ink-2:#A8BAC4; --muted:#7D909C;
  --line:#27353E; --line-2:#36474F;
  --accent:#4FA6C9; --accent-ink:#06171F; --accent-soft:#17323F;
  --danger:#E08874; --ok:#6FC39C;
  --d0:#4FA6C9; --d1:#4FBCAE; --d2:#8FBE6B; --d3:#D6B163; --d4:#D98B93;
  --hit:#E0B45F; --hit-soft:#4A3A1C;
  --c-sky:#5BB2D4; --c-teal:#4FC2B0; --c-green:#93C169; --c-amber:#D9B45E;
  --c-orange:#E0945F; --c-rose:#E07F96; --c-violet:#A98FDD; --c-slate:#93A4AF;
  --dot:rgba(228,237,242,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:252px 1fr;height:100dvh;min-height:520px}

/* ---------- rail ---------- */
.rail{background:var(--ground-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:4px 0 0;font-size:11.5px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.rail-head span{font-size:11px;font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn-new{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:5px 10px;font-size:12.5px;font-weight:500}
.btn-new:hover{filter:brightness(1.08)}
.maplist{list-style:none;margin:0;padding:0 8px 8px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.maplist li{display:flex;align-items:center;gap:8px;border-radius:5px;padding:0 4px 0 10px}
.maplist li:hover{background:var(--surface-2)}
.maplist li.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
.maplist button.pick{flex:1;min-width:0;background:none;border:0;padding:9px 0;text-align:left;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maplist li.on button.pick{font-weight:500}
.maplist .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.maplist .pip{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.maplist .kill{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:4px;line-height:1;font-size:15px;opacity:0;transition:opacity .12s}
.maplist li:hover .kill,.maplist li.on .kill{opacity:1}
.maplist .kill:hover{color:var(--danger);background:var(--surface-2)}
.empty-rail{padding:10px 12px;color:var(--muted);font-size:12.5px;line-height:1.6}
.rail-foot{border-top:1px solid var(--line);padding:11px 14px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.led{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.led.live{background:var(--ok)}
.led.off{background:var(--danger)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.title-in{flex:1;min-width:160px;border:1px solid transparent;background:none;color:var(--ink);font:600 19px/1.3 var(--font-ui);letter-spacing:-.015em;padding:5px 8px;border-radius:5px}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--accent);outline:none;background:var(--surface-2)}
.meta{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:5px;padding:6px 11px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:disabled{opacity:.42;cursor:default}
.btn.save{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:500;min-width:96px}
.btn.save:disabled{background:var(--surface);color:var(--muted);border-color:var(--line)}
/* ---------- 搜尋 ---------- */
.search{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:5px;padding:3px 6px 3px 8px;min-width:188px}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search .mag{width:13px;height:13px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:4px 0;
  -webkit-appearance:none;appearance:none}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:disabled{cursor:default}
.search .qn{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.search .qn.none{color:var(--danger)}
.search .qb{border:0;background:none;color:var(--muted);border-radius:4px;line-height:1;padding:3px 5px;font-size:14px}
.search .qb:hover{background:var(--ground-2);color:var(--ink)}

.notice{padding:9px 18px;font-size:12.5px;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.notice.bad{background:var(--surface-2);border-left:3px solid var(--danger)}

/* ---------- stage ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;
  background-color:var(--ground);
  background-image:radial-gradient(var(--dot) 1px, transparent 1px);
  background-size:22px 22px}
.stage.drag{cursor:grabbing}
.canvas{position:absolute;inset:0;width:8000px;height:6000px;transform-origin:0 0}
#wires{position:absolute;inset:0;width:8000px;height:6000px;pointer-events:none;overflow:visible}

.node{position:absolute;max-width:224px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--nc,var(--d1));border-radius:5px;padding:7px 11px;font-size:14px;line-height:1.45;
  color:var(--ink);box-shadow:var(--shadow);cursor:grab;white-space:pre-wrap;word-break:break-word;
  transition:box-shadow .14s, border-color .14s}
.node:hover{border-color:var(--line-2)}
.node.dragging{opacity:.4;cursor:grabbing}
.node.drop-into{outline:2px dashed var(--accent);outline-offset:3px}
.dropline{position:absolute;height:2px;background:var(--accent);border-radius:2px;z-index:6;pointer-events:none;
  box-shadow:0 0 0 2px var(--accent-soft)}
.dropline[hidden]{display:none!important}
body.dragging-node{cursor:grabbing;user-select:none;-webkit-user-select:none}
.node.tinted{background:var(--surface);background:color-mix(in srgb, var(--nc) 15%, var(--surface));border-color:var(--line)}
.node.root{background:var(--nc,var(--accent));color:var(--accent-ink);border-color:var(--nc,var(--accent));border-left-color:var(--nc,var(--accent));
  font-size:15.5px;font-weight:600;padding:9px 14px;max-width:260px}
.node.sel{box-shadow:0 0 0 2px var(--accent), var(--shadow)}
.node[contenteditable="true"]{cursor:text;outline:none;box-shadow:0 0 0 2px var(--accent), var(--shadow)}
.node .ph{color:var(--muted)}
.node mark{background:var(--hit-soft);color:inherit;border-radius:2px;padding:0 1px}
#nodes.searching .node{opacity:.3}
#nodes.searching .node.hit{opacity:1;border-color:var(--hit);box-shadow:0 0 0 2px var(--hit), var(--shadow)}
#nodes.searching .node.hit.cue{box-shadow:0 0 0 3px var(--hit), var(--shadow)}
.node .badges{display:inline-flex;gap:3px;margin-left:6px;vertical-align:-3px;white-space:nowrap}
.node[contenteditable="true"] .badges{display:none}
.ic{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;flex:none;
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:4px;
  padding:0;text-decoration:none;cursor:pointer}
.ic svg{width:12px;height:12px;display:block}
.ic:hover{color:var(--accent);border-color:var(--accent)}
.ic.on{color:var(--accent);border-color:var(--line-2)}
.node.root .ic{border-color:rgba(127,127,127,.45);background:rgba(127,127,127,.22);color:var(--accent-ink)}
.node.root .ic:hover{border-color:var(--accent-ink)}

/* 節點屬性面板：超連結 + 備註 */
.np{position:absolute;width:290px;max-width:calc(100% - 24px);background:var(--surface);
  border:1px solid var(--line-2);border-radius:7px;padding:12px;box-shadow:var(--shadow);
  transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:6px}
.np[hidden]{display:none!important}
.np label{font-size:11px;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.np input,.np textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:5px;padding:6px 8px;resize:vertical}
.np textarea{min-height:66px;line-height:1.55}
.np input:focus,.np textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.np .np-acts{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
.np .btn{padding:5px 12px;font-size:12.5px}
.np .btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:500}
.np .hint{font-size:11.5px;color:var(--muted);line-height:1.5}

/* 顏色挑選 */
.cp{position:absolute;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;
  padding:10px;box-shadow:var(--shadow);transform:translateX(-50%);z-index:7;
  display:flex;flex-direction:column;gap:8px;width:208px}
.cp[hidden]{display:none!important}
.cp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cp-grid button{width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:5px;padding:0;
  background:var(--sw);cursor:pointer}
.cp-grid button:hover{outline:2px solid var(--ink-2);outline-offset:1px}
.cp-grid button.on{outline:2px solid var(--ink);outline-offset:1px}
.cp-sub{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.cp-sub input{accent-color:var(--accent);margin:0}
.cp-reset{border:1px solid var(--line-2);background:var(--surface-2);border-radius:5px;padding:5px 8px;
  font-size:12.5px;color:var(--ink-2)}
.cp-reset:hover{border-color:var(--ink-2);color:var(--ink)}

/* 備註泡泡 */
.bubble{position:absolute;max-width:300px;background:var(--surface);border:1px solid var(--line-2);
  border-left:3px solid var(--accent);border-radius:6px;padding:9px 12px;box-shadow:var(--shadow);
  font-size:13px;line-height:1.65;white-space:pre-wrap;transform:translateX(-50%);z-index:6;color:var(--ink)}
.bubble[hidden]{display:none!important}

.tb{position:absolute;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:6px;padding:3px;box-shadow:var(--shadow);transform:translate(-50%,-100%);z-index:5}
.tb[hidden]{display:none!important}
.tb button{border:0;background:none;border-radius:4px;padding:5px 8px;font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
.tb button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.tb button:disabled{opacity:.35;cursor:default}
.tb button.del:hover{color:var(--danger)}
.tb .sep{width:1px;background:var(--line);margin:3px 2px}

.zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;z-index:4}
.zoom button{width:30px;height:30px;border:1px solid var(--line-2);background:var(--surface);border-radius:5px;
  box-shadow:var(--shadow);font-size:14px;line-height:1;display:grid;place-items:center}
.zoom button.wide{width:auto;padding:0 10px;font-size:12px}
.zoom button:hover{border-color:var(--ink-2)}

.blank{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px}
.blank h2{margin:0;font-size:19px;font-weight:600}
.blank p{margin:0;max-width:34em;color:var(--ink-2);line-height:1.7;font-size:13.5px}
.blank[hidden]{display:none!important}

.keys{display:flex;gap:16px;flex-wrap:wrap;padding:9px 18px;border-top:1px solid var(--line);background:var(--surface);
  font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:9px 16px;border-radius:6px;font-size:13px;box-shadow:var(--shadow);z-index:40}
.toast[hidden]{display:none!important}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);max-height:36dvh}
  .brand{padding:12px 14px 10px}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>心智圖工具</h1>
      <p>Mind Map Tool</p>
    </div>
    <div class="rail-head">
      <span id="railCount">我的心智圖</span>
      <button class="btn-new" id="btnNew">＋ 新增</button>
    </div>
    <ul class="maplist" id="maplist"></ul>
    <div class="rail-foot"><i class="led" id="led"></i><span id="ledText">連線中…</span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <input class="title-in" id="titleIn" placeholder="心智圖名稱" autocomplete="off" spellcheck="false" disabled>
      <span class="meta" id="metaTxt"></span>
      <div class="search" id="search">
        <svg class="mag" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14"/></svg>
        <input id="q" type="search" placeholder="搜尋節點" autocomplete="off" spellcheck="false" aria-label="搜尋這張心智圖的節點" disabled>
        <span class="qn" id="qn" hidden></span>
        <button class="qb" id="qPrev" title="上一個符合的節點" hidden>&#8249;</button>
        <button class="qb" id="qNext" title="下一個符合的節點" hidden>&#8250;</button>
        <button class="qb" id="qClear" title="清除搜尋" hidden>&#215;</button>
      </div>
      <div class="acts">
        <button class="btn" id="btnFit">置中</button>
        <button class="btn save" id="btnSave" disabled>已儲存</button>
      </div>
    </div>
    <div class="notice" id="notice" hidden></div>

    <div class="stage" id="stage">
      <div class="canvas" id="canvas">
        <svg id="wires" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>

      <div class="tb" id="tb" hidden>
        <button data-act="child">＋ 子節點</button>
        <button data-act="sib">＋ 同層</button>
        <i class="sep"></i>
        <button data-act="rename">改名</button>
        <button data-act="color">顏色</button>
        <button data-act="link">連結</button>
        <button data-act="note">備註</button>
        <button class="del" data-act="del">刪除</button>
      </div>

      <div class="np" id="np" hidden>
        <label for="npUrl">超連結</label>
        <input id="npUrl" type="url" inputmode="url" placeholder="https://example.com" autocomplete="off" spellcheck="false">
        <label for="npNote">備註</label>
        <textarea id="npNote" placeholder="寫給自己看的補充說明，不會顯示在圖上"></textarea>
        <p class="hint">留空白＝移除。節點上會出現小圖示，點一下就能開連結或看備註。</p>
        <div class="np-acts">
          <button class="btn" id="npCancel">取消</button>
          <button class="btn primary" id="npOk">套用</button>
        </div>
      </div>

      <div class="cp" id="cp" hidden>
        <div class="cp-grid" id="cpGrid"></div>
        <label class="cp-sub"><input type="checkbox" id="cpDeep"> 同時套用到底下所有分支</label>
        <button class="cp-reset" id="cpReset">改回跟著層級的顏色</button>
      </div>

      <div class="bubble" id="bubble" hidden></div>
      <div class="dropline" id="dropline" hidden></div>

      <div class="blank" id="blank">
        <h2>還沒有開啟的心智圖</h2>
        <p>左邊按「＋ 新增」開一張新的心智圖，或從清單挑一張。每張心智圖從一個中心主題開始，往外長出分支。</p>
        <button class="btn" id="btnNew2">＋ 新增心智圖</button>
      </div>

      <div class="zoom">
        <button id="zOut" title="縮小">−</button>
        <button id="zIn" title="放大">＋</button>
        <button class="wide" id="zReset">100%</button>
      </div>
    </div>

    <div class="keys">
      <span><kbd>Tab</kbd> 新增子節點</span>
      <span><kbd>Enter</kbd> 新增同層節點</span>
      <span><kbd>F2</kbd> / 雙擊 改文字</span>
      <span><kbd>Delete</kbd> 刪除節點</span>
      <span><kbd>⌘S</kbd> 存檔</span>
      <span><kbd>⌘F</kbd> 搜尋節點</span>
